name: SoloWeld Weekly AI & Welding News

on:
schedule:
# Chạy tự động vào 01:00 UTC (tức 08:00 sáng giờ Việt Nam GMT+7) Thứ Bảy hằng tuần
- cron: '0 1 * * 6'
workflow_dispatch:
inputs:
topic_rotation:
description: 'Chọn chuyên đề (auto: xoay vòng theo tuần, digest: tổng hợp, hoặc mã chuyên đề)'
required: false
default: 'auto'
type: choice
options:
- auto
- digest
- ai_cv_welding
- blockchain_cert_traceability
- welder_training_digital
- smart_robotic_waam
lookback_days:
description: 'Số ngày quét bài báo gần nhất (mặc định 60 ngày)'
required: false
default: '60'
publish_mode:
description: 'Chế độ cập nhật (direct_push: đẩy thẳng lên main, pull_request: tạo PR duyệt trước)'
required: false
default: 'direct_push'
type: choice
options:
- direct_push
- pull_request

permissions:
contents: write
pull-requests: write

concurrency:
group: soloweld-weekly-news
cancel-in-progress: false

jobs:
generate-and-publish:
name: Generate & Publish Weekly Technical News
runs-on: ubuntu-latest
timeout-minutes: 25

steps:
  - name: Checkout repository soloweld.github.io
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Set up Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: 'pip'

  - name: Install Python dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4 pillow pymupdf

  - name: Run SoloWeld News Generator
    id: generator
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'contact@soloweld.github.io' }}
      TOPIC_ROTATION: ${{ github.event.inputs.topic_rotation || 'auto' }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '60' }}
    run: |
      python scripts/generate_soloweld_news.py

  - name: Upload Draft Artifact (for audit & backup)
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: soloweld-news-draft-${{ github.run_id }}
      path: |
        .draft/
        data/news_index.json
        news/posts/
        images/news/
      if-no-files-found: ignore
      retention-days: 14

  - name: Commit and Push directly to main branch
    if: steps.generator.outputs.skipped != 'true' && (github.event.inputs.publish_mode == 'direct_push' || github.event.inputs.publish_mode == '')
    run: |
      git config user.name "SoloWeld AI Editorial Bot"
      git config user.email "bot@soloweld.github.io"
      git add data/news_index.json data/used_dois.json news/posts/ images/news/
      if git diff --staged --quiet; then
        echo "Không có thay đổi mới để commit."
      else
        git commit -m "chore(news): publish weekly technical insight ${{ steps.generator.outputs.post_id }}"
        git pull --rebase origin ${{ github.ref_name }}
        git push origin HEAD:${{ github.ref_name }}
      fi

  - name: Create Pull Request (if pull_request mode selected)
    if: steps.generator.outputs.skipped != 'true' && github.event.inputs.publish_mode == 'pull_request'
    uses: peter-evans/create-pull-request@v6
    with:
      token: ${{ secrets.GITHUB_TOKEN }}
      commit-message: "chore(news): draft weekly insight ${{ steps.generator.outputs.post_id }}"
      branch: "auto-news/${{ steps.generator.outputs.post_id }}"
      delete-branch: true
      title: "[Weekly News] ${{ steps.generator.outputs.title_vi }}"
      body: |
        ### Bản tin Kỹ thuật Hàng tuần SoloWeld (Tự động tổng hợp)
        - **Mã bài viết:** `${{ steps.generator.outputs.post_id }}`
        - **Tiêu đề (VI):** ${{ steps.generator.outputs.title_vi }}
        - **Title (EN):** ${{ steps.generator.outputs.title_en }}

        #### Nhật ký thu thập dữ liệu & hình ảnh (Diagnostics)
        ```text
        ${{ steps.generator.outputs.diag }}
        ```
