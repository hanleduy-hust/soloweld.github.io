name: SoloWeld Weekly AI & Welding News

on:
  schedule:
    # Chạy tự động vào 01:00 UTC (tức 08:00 sáng giờ Việt Nam GMT+7) Thứ Bảy hằng tuần
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      topic_rotation:
        description: 'Chọn chuyên đề (auto: xoay vòng theo tuần, digest: tổng hợp, hoặc mã chuyên đề)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'digest'
          - 'ai_cv_welding'
          - 'blockchain_cert'
          - 'robotics_automation'
          - 'training_standards'

permissions:
  contents: write

jobs:
  build-and-publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymupdf pillow google-genai google-generativeai beautifulsoup4

      - name: Ensure directories exist
        run: |
          mkdir -p data news/posts news/images

      - name: Run SoloWeld AI News Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_ROTATION: ${{ inputs.topic_rotation || 'auto' }}
          SOLOWELD_TOPIC: ${{ inputs.topic_rotation || 'auto' }}
        run: |
          python scripts/generate_soloweld_news.py

      - name: Commit and push updated news
        run: |
          git config --global user.name "SoloWeld AI Bot"
          git config --global user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Không có thay đổi mới nào cần commit."
          else
            git commit -m "chore(news): cập nhật bản tin AI & Công nghệ Hàn hàng tuần ($(date +'%Y-%m-%d'))"
            git push origin main || git push
          fi
