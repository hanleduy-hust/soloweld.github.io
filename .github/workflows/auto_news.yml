name: SoloWeld Weekly AI & Welding News

on:
  push:
    branches: [main]
    paths:
      - 'scripts/run_news_now.txt'
  schedule:
    # Chạy tự động vào 01:00 UTC (tức 08:00 sáng giờ Việt Nam GMT+7) Thứ Bảy hằng tuần
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      topic_rotation:
        description: 'Chọn chuyên đề (auto: xoay vòng theo tuần, digest: tổng hợp, hoặc mã chuyên đề)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'digest'
          - 'ai_cv_welding'
          - 'blockchain_cert_traceability'
          - 'smart_robotic_waam'
          - 'welder_training_digital'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: soloweld-news
  cancel-in-progress: false

jobs:
  build-and-publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymupdf pillow google-genai google-generativeai beautifulsoup4

      - name: Ensure directories exist
        run: |
          mkdir -p data news/posts images/news

      - name: Run SoloWeld AI News Generator
        id: gen
        env:
          DRAFT_DIR: ${{ runner.temp }}/soloweld-draft
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMPACT_TEST: ${{ github.event_name == 'push' && 'true' || 'false' }}
          MAX_PAPERS: ${{ github.event_name == 'push' && '8' || '16' }}
          MAX_FIGURES: ${{ github.event_name == 'push' && '3' || '8' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || (github.event_name == 'push' && 'gemini-flash-lite-latest') || '' }}
          TOPIC_ROTATION: ${{ inputs.topic_rotation || (github.event_name == 'push' && 'smart_robotic_waam') || 'auto' }}
        run: |
          python scripts/generate_soloweld_news.py

      - name: Save review copy
        if: steps.gen.outputs.skipped == 'false'
        env:
          POST_ID: ${{ steps.gen.outputs.post_id }}
          DRAFT_DIR: ${{ runner.temp }}/soloweld-draft
        run: |
          mkdir -p "$DRAFT_DIR/images/news/$POST_ID"
          cp "news/posts/$POST_ID.json" "$DRAFT_DIR/post.json"
          cp "images/news/$POST_ID/"*.jpg "$DRAFT_DIR/images/news/$POST_ID/"

      - name: Open news pull request
        id: cpr
        if: steps.gen.outputs.skipped == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: auto-news/${{ steps.gen.outputs.post_id }}
          delete-branch: true
          commit-message: "chore(news): ${{ steps.gen.outputs.title_vi }}"
          title: "[Cần duyệt] ${{ steps.gen.outputs.title_vi }}"
          body: |
            Bản tin SoloWeld được tạo theo lịch chuyên đề.
            Kiểm tra nội dung trong Files changed, sau đó merge PR để xuất bản.
          add-paths: |
            data/news_index.json
            data/used_dois.json
            news/posts/**
            images/news/**

      - name: Send review email
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          DRAFT_DIR: ${{ runner.temp }}/soloweld-draft
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/send_review_email.py
