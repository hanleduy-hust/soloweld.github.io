          title: "Sample Preview Article — Run the GitHub Actions workflow 'SoloWeld Weekly AI & Welding News' to populate live OpenAlex papers",
          journal: "SoloWeld Technical Portal",
          date: "2026-11-14",
          doi: "10.1000/soloweld.preview"
        }
      ]
    };

    let currentLang = localStorage.getItem("soloweld_lang") || "vi";
    let currentTopic = "all";
    let currentType = "all";
    let postsIndex = [FALLBACK_SAMPLE_POST];
    let activePost = null;
    let readerContentLang = currentLang;

    function pickLocalized(obj, prefix) {
      if (!obj) return "";
      return obj[`${prefix}_${currentLang}`] || obj[`${prefix}_en`] || obj[`${prefix}_vi`] || "";
    }

    function updateListLabels(t) {
      const labels = {
        "vi": [
          "Giới thiệu về chuyên mục",
          "Các bản tin được AI tự động biên soạn toàn bộ dựa trên các tài liệu tham khảo liệt kê trong từng bài.",
          "Chuyên đề",
          "Điểm tin khoa học",
          "Để trích dẫn chính bản tin, dùng mẫu ở cuối bài và ghi rõ nội dung do AI biên soạn."
        ],
        "en": [
          "About this section",
          "Each digest is written entirely by AI based on the sources listed in the article.",
          "Features",
          "Research digests",
          "To cite the digest itself, use the example at the end of the article and identify it as AI-generated."
        ],
        "zh": [
          "栏目简介",
          "每篇简报均由 AI 根据文中列出的参考资料自动编写。",
          "专题",
          "科研简报",
          "引用简报本身时，请使用文末示例并注明由 AI 编写。"
        ],
        "ja": [
          "このコーナーについて",
          "各記事は、記事内の参考文献に基づいてAIが全編を自動作成します。",
          "特集",
          "研究ダイジェスト",
          "記事自体を引用する場合は、文末の例に従い、AIが作成したことを明記してください。"
        ]
      }[currentLang];
      const notes = editorialNotes[currentLang];
      document.getElementById("news-about-title").textContent = labels[0];
      document.getElementById("news-about-ai").textContent = labels[1];
      document.getElementById("news-about-responsibility").textContent = notes[2];
      document.getElementById("news-citation-label").textContent = notes[3];
      document.getElementById("news-citation-original").textContent = notes[4];
      document.getElementById("news-citation-digest").textContent = labels[4];

      const typeLabels = { all: t.filterAll, feature: labels[2], digest: labels[3] };
      document.querySelectorAll("#type-filters button").forEach(button => {
        const active = button.dataset.type === currentType;
        button.textContent = typeLabels[button.dataset.type];
        button.setAttribute("aria-pressed", active);
        button.className = "rounded-full border px-4 py-1.5 text-sm font-semibold cursor-pointer " +
          (active ? "bg-blue-600 border-blue-600 text-white" : "bg-white border-slate-200 text-slate-700 hover:border-blue-400");
      });
    }

    function filterType(type) {
      currentType = type;
      updateListLabels(translations[currentLang]);
      renderPostGrid();
    }

    function setLanguage(lang) {
      if (!translations[lang]) lang = "vi";
      currentLang = lang;
      readerContentLang = lang;
      localStorage.setItem("soloweld_lang", lang);

      ["vi", "en", "zh", "ja"].forEach(l => {
        const btn = document.getElementById(`lang-btn-${l}`);
        if (btn) {
          btn.className = l === lang
            ? "px-2.5 py-1 text-xs font-bold rounded-md bg-blue-600 text-white shadow-xs transition cursor-pointer"
            : "px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition cursor-pointer";
        }
      });

      const t = translations[lang];
      updateListLabels(t);
      document.getElementById("ui-page-badge").textContent = t.pageBadge;
      document.getElementById("ui-back-home").textContent = t.backHome;
      document.getElementById("ui-schedule-badge").textContent = t.scheduleBadge;
      document.getElementById("ui-hero-title").textContent = t.heroTitle;
      document.getElementById("ui-hero-desc").textContent = t.heroDesc;
      document.getElementById("search-input").placeholder = t.searchPlaceholder;
      document.getElementById("ui-back-list").textContent = t.backList;
      document.getElementById("ui-refs-title").textContent = t.refsTitle;
      document.getElementById("ui-content-lang-note").textContent = t.contentLangNote;

      const filterMap = {
        all: t.filterAll,
        ai_cv_welding: t.filterAI,
        blockchain_cert_traceability: t.filterBlockchain,
        welder_training_digital: t.filterTraining,
        smart_robotic_waam: t.filterRobotic
      };
      document.querySelectorAll(".topic-chip").forEach(btn => {
        const key = btn.getAttribute("data-topic");
        if (filterMap[key]) btn.textContent = filterMap[key];
      });

      renderPostGrid();
      if (activePost) renderActivePost();
    }

    function filterTopic(topic) {
      currentTopic = topic;
      document.querySelectorAll(".topic-chip").forEach(btn => {
        const active = btn.getAttribute("data-topic") === topic;
        btn.className = active
          ? "topic-chip px-3.5 py-1.5 rounded-full text-xs font-semibold transition bg-blue-600 text-white cursor-pointer"
          : "topic-chip px-3.5 py-1.5 rounded-full text-xs font-semibold transition bg-white text-slate-700 border border-slate-200 hover:border-blue-400 cursor-pointer";
      });
      renderPostGrid();
    }

    function renderPostGrid() {
      const grid = document.getElementById("posts-grid");
      const q = (document.getElementById("search-input").value || "").trim().toLowerCase();
      const t = translations[currentLang];

      const filtered = postsIndex.filter(p => {
        if (currentType !== "all" && p.type !== currentType) return false;
        if (currentTopic !== "all" && p.topic_key !== currentTopic) return false;
        if (!q) return true;
        const hay = [
          p.title_vi, p.title_en, p.title_zh, p.title_ja,
          p.summary_vi, p.summary_en, p.summary_zh, p.summary_ja,
          ...(p.tags || [])
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-500">${t.emptyState}</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const title = pickLocalized(p, "title");
        const summary = pickLocalized(p, "summary");
        const cat = pickLocalized(p, "category");
        const coverHtml = p.cover
          ? `<img src="${p.cover}" alt="${title}" loading="lazy" class="w-full h-48 sm:h-full object-contain bg-slate-50">`
          : `<div class="w-full h-48 sm:h-full bg-gradient-to-br from-blue-900 to-slate-800 flex items-center justify-center text-blue-200 font-bold text-sm px-6 text-center">${cat}</div>`;
        const tagsHtml = (p.tags || []).slice(0, 4).map(tag =>
          `<span class="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">${tag}</span>`
        ).join("");

        return `
          <article class="bg-white rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition overflow-hidden flex flex-col sm:flex-row">
            <a href="#post=${encodeURIComponent(p.id)}" class="block overflow-hidden sm:w-1/4 sm:shrink-0">${coverHtml}</a>
            <div class="p-5 sm:p-7 flex-1 flex flex-col min-w-0">
              <div class="flex items-center justify-between gap-2 text-xs text-slate-500 mb-2">
                <span class="font-semibold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-md">${cat}</span>
                <time>${p.date}</time>
              </div>
              <h2 class="text-xl font-bold text-slate-900 mb-2 hover:text-blue-600 transition">
                <a href="#post=${encodeURIComponent(p.id)}">${title}</a>
              </h2>
              <p class="text-sm text-slate-600 line-clamp-3 mb-4 flex-1">${summary}</p>
              <div class="flex flex-wrap gap-1.5 mb-4">${tagsHtml}</div>
              <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                <span class="text-slate-500">${p.paper_count || 0} ${t.papersLabel} • ${p.figure_count || 0} ${t.figuresLabel}</span>
                <a href="#post=${encodeURIComponent(p.id)}" class="font-bold text-blue-600 hover:text-blue-800">${t.readMore}</a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function openPostById(postId) {
      if (postId === FALLBACK_SAMPLE_POST.id) {
        activePost = FALLBACK_SAMPLE_POST;
        readerContentLang = currentLang;
        document.getElementById("posts-grid").classList.add("hidden");
        document.getElementById("list-controls").classList.add("hidden");
        document.getElementById("news-intro").classList.add("hidden");
        document.getElementById("post-reader").classList.remove("hidden");
        renderActivePost();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const meta = postsIndex.find(p => p.id === postId);
      const fileUrl = meta?.file || `news/posts/${postId}.json`;
      try {
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        activePost = await res.json();
        readerContentLang = currentLang;
        document.getElementById("posts-grid").classList.add("hidden");
        document.getElementById("list-controls").classList.add("hidden");
        document.getElementById("news-intro").classList.add("hidden");
        document.getElementById("post-reader").classList.remove("hidden");
        renderActivePost();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        console.error("Không tải được bài viết:", err);
      }
    }

    function switchReaderContentLang(lang) {
      readerContentLang = lang;
      renderActivePost();
    }


    const editorialNotes = {
      "vi": [
        "Công bố về AI và trách nhiệm sử dụng",
        "Bản tin này được AI tự động biên soạn toàn bộ dựa trên các tài liệu được liệt kê trong mục Tài liệu tham khảo.",
        "Nội dung chỉ dùng để tham khảo và có thể có sai sót. Người đọc tự chịu trách nhiệm về việc áp dụng vào công việc của mình. Trước khi sử dụng cho thiết kế, chế tạo, kiểm định hoặc nghiên cứu, hãy đối chiếu bài báo gốc và các tiêu chuẩn áp dụng.",
        "Hướng dẫn trích dẫn",
        "Khi sử dụng kết quả, số liệu hoặc hình ảnh, hãy trích dẫn bài báo gốc theo DOI trong danh mục của từng bài. Nếu tái sử dụng hình ảnh, hãy ghi nguồn và tuân thủ giấy phép của hình.",
        "Nếu cần dẫn chính phần tổng hợp, hãy trích dẫn bản tin SoloWeld theo mẫu dưới đây và ghi rõ nội dung do AI biên soạn.",
        "Bản tin do AI biên soạn",
        "Truy cập"
      ],
      "en": [
        "AI disclosure and responsibility for use",
        "This digest was written entirely by AI based on the sources listed in the References section.",
        "The content is for reference and may contain errors. Readers are responsible for how they apply it in their work. For design, manufacturing, inspection, or research, verify the information against the original papers and applicable standards.",
        "How to cite",
        "When using a finding, data point, or figure, cite the original paper using the DOI listed in the article. When reusing figures, credit the source and follow its license.",
        "When referring to this synthesis itself, cite the SoloWeld digest using the example below and identify it as AI-generated.",
        "AI-generated digest",
        "Accessed"
      ],
      "zh": [
        "AI 编写声明与使用责任",
        "本简报完全由 AI 根据参考文献中列出的资料自动编写。",
        "内容仅供参考，可能存在错误。读者应自行承担将其用于工作的责任。用于设计、制造、检验或研究前，请核对原始论文及适用标准。",
        "引用指南",
        "引用研究结果、数据或图片时，请通过文章中所列 DOI 引用原始论文。转载图片时，请注明来源并遵守其许可。",
        "引用本综述时，请参照下方示例引用 SoloWeld 简报，并注明其由 AI 编写。",
        "AI 编写简报",
        "访问日期"
      ],
      "ja": [
        "AIによる作成の開示と利用責任",
        "本ダイジェストは、参考文献に記載した資料に基づき、全編をAIが自動で作成しました。",
        "内容は参考用であり、誤りを含む可能性があります。業務への適用は読者自身の責任で行ってください。設計、製造、検査、研究に用いる前に、原著論文と適用規格を確認してください。",
        "引用ガイド",
        "研究結果、データ、図を利用する場合は、記事に記載されたDOIを用いて原著論文を引用してください。図を再利用する際は、出典を明記し、ライセンスに従ってください。",
        "本ダイジェストの要約自体を参照する場合は、下記の例に従ってSoloWeldの記事を引用し、AIが作成したことを明記してください。",
        "AI作成ダイジェスト",
        "閲覧日"
      ]
    };

    function renderEditorialNotes() {
      const sample = activePost.id === FALLBACK_SAMPLE_POST.id;
      document.getElementById("reader-disclosure").hidden = sample;
      document.getElementById("reader-citation").hidden = sample;
      if (sample) return;

      const notes = editorialNotes[readerContentLang] || editorialNotes.en;
      const fields = ["disclosure-title", "disclosure-ai", "disclosure-responsibility",
        "citation-title", "citation-original", "citation-digest"];
      fields.forEach((id, index) => {
        document.getElementById(id).textContent = notes[index];
      });

      const url = new URL("news.html", window.location.href);
      url.hash = "post=" + encodeURIComponent(activePost.id);
      const title = activePost["title_" + readerContentLang] || pickLocalized(activePost, "title");
      const accessed = new Date().toLocaleDateString(readerContentLang);
      document.getElementById("citation-example").textContent =
        `SoloWeld. (${activePost.date}). ${title} [${notes[6]}]. ${notes[7]} ${accessed}. ${url.href}`;
    }

    function renderActivePost() {
      if (!activePost) return;
      const t = translations[currentLang];
      document.getElementById("reader-category").textContent = pickLocalized(activePost, "category");
      document.getElementById("reader-date").textContent = activePost.date;
      document.getElementById("reader-stats").textContent = `${activePost.paper_count || (activePost.references || []).length} ${t.papersLabel}`;
      document.getElementById("reader-title").textContent = pickLocalized(activePost, "title");

      document.getElementById("reader-tags").innerHTML = (activePost.tags || []).map(tag =>
        `<span class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md font-medium">#${tag}</span>`
      ).join("");

      ["vi", "en", "zh", "ja"].forEach(l => {
        const btn = document.getElementById(`reader-lang-${l}`);
        if (btn) {
          btn.className = l === readerContentLang
            ? "px-2.5 py-1 rounded-md font-bold bg-blue-600 text-white cursor-pointer"
            : "px-2.5 py-1 rounded-md font-medium text-slate-600 hover:bg-slate-100 cursor-pointer";
        }
      });

      const bodyHtml = activePost[`content_${readerContentLang}`] || activePost.content_en || activePost.content_vi || "";
      document.getElementById("reader-body").innerHTML = bodyHtml;
      renderEditorialNotes();

      const refsList = document.getElementById("reader-refs");
      refsList.innerHTML = (activePost.references || []).map(r => {
        const authors = (r.authors || []).join(", ") + (r.more_authors ? " et al." : "");
        return `
          <li id="ref-${r.n}" class="leading-relaxed">
            <span class="font-medium text-slate-800">${authors}</span> (${r.date ? r.date.slice(0, 4) : ""}).
            “${r.title}.” <em>${r.journal || ""}</em>.
            <a href="https://doi.org/${r.doi}" target="_blank" rel="noopener" class="text-blue-600 hover:underline font-medium">https://doi.org/${r.doi}</a>
          </li>
        `;
      }).join("");
    }

    function closePost() {
      activePost = null;
      if (window.location.hash) {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
      document.getElementById("post-reader").classList.add("hidden");
      document.getElementById("posts-grid").classList.remove("hidden");
      document.getElementById("list-controls").classList.remove("hidden");
      document.getElementById("news-intro").classList.remove("hidden");
    }

    function handleHashRoute() {
      const hash = window.location.hash || "";
      if (hash.startsWith("#post=")) {
        const id = decodeURIComponent(hash.replace("#post=", ""));
        openPostById(id);
      } else {
        closePost();
      }
    }

    async function initNewsPortal() {
      setLanguage(currentLang);
      try {
        const res = await fetch("data/news_index.json", { cache: "no-store" });
        if (res.ok) {
          const loaded = await res.json();
          if (Array.isArray(loaded) && loaded.length > 0) {
            postsIndex = loaded;
          }
        }
      } catch (e) {
        // Khi chưa có data/news_index.json, tự động hiển thị bài mẫu FALLBACK_SAMPLE_POST
      }
      renderPostGrid();
      handleHashRoute();
      window.addEventListener("hashchange", handleHashRoute);
    }

    document.addEventListener("DOMContentLoaded", initNewsPortal);
  </script>
</body>
</html>
